
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f97316">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3774/3774270.png">
    <title>Enduro Route Planner beta</title>
    <meta name="description" content="A specialized tool for enduro riders to design, merge, and export trails to GPX format using high-detail topographic maps.">
    <meta property="og:title" content="Enduro Route Planner beta">
    <meta property="og:description" content="A specialized tool for enduro riders to design, merge, and export trails to GPX format using high-detail topographic maps.">
    <script>
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) { r.unregister(); }
          }).catch(function() {});
        }
      } catch (e) {}
      try {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var k of keys) { caches.delete(k); }
          }).catch(function() {});
        }
      } catch (e) {}
    </script>
    <script>
      window.addEventListener('error', function(e) {
        console.error("Global Error Caught:", e.error || e.message);
        var el = document.getElementById('global-err-box');
        if (el) {
          el.style.display = 'block';
          el.innerText = 'Error: ' + (e.error ? (e.error.stack || e.error.message) : e.message);
        }
      });
    </script>
    <style>
        html, body, #root {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #18181b;
            overflow: hidden;
        }
        #root {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .leaflet-container {
            height: 100%;
            width: 100%;
            outline: none;
            background-color: #27272a;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .custom-flag div {
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-black">
    <div id="global-err-box" style="display:none;position:fixed;top:10px;left:10px;right:10px;z-index:99999;background:#7f1d1d;color:#fee2e2;padding:16px;border-radius:12px;font-family:sans-serif;font-size:13px;word-break:break-word;border:2px solid #ef4444;box-shadow:0 10px 30px rgba(0,0,0,0.8);"></div>
    <div id="root">
      <div style="display:flex;height:100%;width:100%;align-items:center;justify-content:center;background:#09090b;color:#ffffff;font-family:system-ui,sans-serif;flex-direction:column;gap:12px;">
        <div style="font-size:24px;font-weight:900;color:#f97316;letter-spacing:1px;">ENDURO ROUTE PLANNER</div>
        <div style="font-size:13px;color:#a1a1aa;">Φόρτωση χάρτη και εργαλείων...</div>
      </div>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
